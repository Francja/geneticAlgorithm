name: Mutation testing

# mutmut rewrites the library's source one small change at a time (">" -> ">=",
# "+ 1" -> "+ 2", True -> False, ...) and re-runs the tests for each change.
# A mutant the tests still pass on ("survived") marks code whose behaviour no
# test actually asserts. Too slow for every pull request, so it runs weekly and
# on demand.
#
# Not covered: the Keras backend (needs TensorFlow; see [tool.mutmut] in
# pyproject.toml).

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      min_score:
        description: "Fail below this mutation score (%)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  # Baseline when added: 77.1% (1269/1645, mutmut 3.8.1). Raise as tests improve.
  MIN_MUTATION_SCORE: ${{ inputs.min_score || '75' }}

jobs:
  mutmut:
    name: mutation testing (mutmut)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, tests and mutmut
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sklearn,dev]" "mutmut==3.8.1"

      - name: Run mutmut
        run: mutmut run --max-children "$(nproc)"

      - name: Score and gate
        run: |
          mutmut export-cicd-stats
          python - <<'PY'
          import json, os, sys
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          killed = s["killed"] + s.get("timeout", 0)
          survived = s["survived"]
          # mutants no test reaches count against the score, like survivors
          no_tests = s.get("no_tests", 0)
          scored = killed + survived + no_tests
          score = 100.0 * killed / scored if scored else 0.0
          lines = [
              "## Mutation testing",
              "",
              f"**Score: {score:.1f}%** ({killed} killed / {scored} scored mutants)",
              "",
              "| killed | survived | no tests | timeout | suspicious | skipped | total |",
              "|---|---|---|---|---|---|---|",
              "| {} | {} | {} | {} | {} | {} | {} |".format(
                  s["killed"], survived, no_tests, s.get("timeout", 0),
                  s.get("suspicious", 0), s.get("skipped", 0), s["total"]),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          minimum = float(os.environ["MIN_MUTATION_SCORE"])
          if score < minimum:
              sys.exit(f"Mutation score {score:.1f}% is below the {minimum}% gate.")
          PY

      - name: List surviving mutants
        if: always()
        run: mutmut results > surviving-mutants.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: |
            surviving-mutants.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
