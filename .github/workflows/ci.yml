name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      index_url:
        description: "Index URL for the published-package lifecycle job (leave empty to skip)"
        required: false
        default: ""
      previous_version:
        description: "Previously published version (required when index_url is set)"
        required: false
        default: ""
      candidate_version:
        description: "Candidate version to upgrade to (required when index_url is set)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sklearn,dev]"

      - name: Run test suite
        run: python -m pytest -q --disable-warnings

      - name: Run scikit-learn examples
        if: matrix.python-version == '3.12'
        run: |
          python examples/iris_example.py
          python examples/target_accuracy_example.py

  keras:
    name: tests (Python 3.12, Keras/TensorFlow)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with TensorFlow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sklearn,dev]" "tensorflow-cpu>=2.16"

      - name: Run full suite with coverage
        run: |
          python -m pytest -q --disable-warnings \
            --cov=dnnga --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=95

      - name: Run Keras example
        run: python examples/keras_example.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    name: build and test wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel and run the tests against it
        run: |
          python -m pip install dist/*.whl "scikit-learn>=1.1" pytest
          python -m pytest -q --disable-warnings

      - name: Smoke-test the installed package
        run: python -c "import dnnga; print('dnnga', dnnga.__version__)"

      - name: Smoke-test the console script
        run: dnnga --mode synthetic --population 4 --generations 1 --seed 0

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  package-lifecycle:
    name: package lifecycle (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Run lifecycle tests (install -> smoke -> uninstall)
        env:
          DNNGA_WHEEL_DIR: dist
        run: python -m pytest tests/lifecycle/package_lifecycle.py -q --disable-warnings

  package-lifecycle-keras:
    name: package lifecycle (Keras extra, Linux 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Run Keras lifecycle smoke
        env:
          DNNGA_WHEEL_DIR: dist
          DNNGA_TEST_KERAS: "1"
        run: python -m pytest tests/lifecycle/package_lifecycle.py -q --disable-warnings -k keras

  package-lifecycle-index:
    name: published-package lifecycle (TestPyPI -> PyPI)
    if: github.event_name == 'workflow_dispatch' && inputs.index_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Run published upgrade lifecycle
        env:
          DNNGA_INDEX_URL: ${{ inputs.index_url }}
          DNNGA_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          DNNGA_VERSION: ${{ inputs.candidate_version }}
        run: python -m pytest tests/lifecycle/package_lifecycle.py -q --disable-warnings -k published_upgrade
